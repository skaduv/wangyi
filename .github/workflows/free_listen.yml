name: 网易云音乐 - 看广告免费听

on:
  schedule:
    # UTC 00:00 / 01:00 / 02:00 = 北京时间 08:00 / 09:00 / 10:00
    # 配合脚本内随机延迟,覆盖 08:00-11:00 随机启动
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: '看广告轮数'
        required: false
        default: '10'
        type: string

jobs:
  watch-ads:
    runs-on: ubuntu-latest
    concurrency:
      group: free-listen-daily
      cancel-in-progress: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # actions/cache 的键不可覆盖，因此每次运行使用唯一键保存最新索引，
      # 后续运行通过同一上海日期的前缀恢复最近一次状态。
      - name: 生成上海日期
        id: cache-date
        env:
          TZ: 'Asia/Shanghai'
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: 缓存 b_tag 轮换状态
        uses: actions/cache@v4
        with:
          path: b_tag_state.json
          key: free-listen-btag-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            free-listen-btag-${{ steps.cache-date.outputs.date }}-

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests pycryptodome

      - name: 检查 user.json 配置
        run: python3 .github/workflows/inject_config.py

      - name: 运行看广告脚本
        env:
          TZ: 'Asia/Shanghai'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_ROUNDS: ${{ github.event.inputs.rounds }}
        run: python3 .github/workflows/run_ads.py
