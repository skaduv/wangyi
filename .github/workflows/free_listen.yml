name: 网易云音乐 - 看广告免费听

on:
  schedule:
    # UTC 00:00 / 01:00 / 02:00 = 北京时间 08:00 / 09:00 / 10:00
    # 配合脚本内随机延迟,覆盖 08:00-11:00 随机启动
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: '看广告轮数'
        required: false
        default: '10'
        type: string

jobs:
  watch-ads:
    runs-on: ubuntu-latest
    concurrency:
      group: free-listen-daily
      cancel-in-progress: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests pycryptodome

      - name: 计算北京时间日期 (用于广告计数缓存 key)
        run: echo "AD_STATE_DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)" >> "$GITHUB_ENV"

      # 广告计数持久化: GitHub Actions 每次运行是全新环境, 本地文件会丢失。
      # 用 actions/cache 按日期缓存 ad_state.json:
      #   - key 带文件哈希: 每次计数变化后生成新 key, 保证 save 阶段总能写入
      #   - restore-keys 按日期前缀匹配: 同一天多次调度恢复最新计数
      #   - 跨天自动生成新前缀, 实现计数重置
      - name: 恢复广告计数缓存
        uses: actions/cache@v4
        with:
          path: ad_state.json
          key: ad-state-${{ env.AD_STATE_DATE }}-${{ hashFiles('ad_state.json') }}
          restore-keys: |
            ad-state-${{ env.AD_STATE_DATE }}-

      - name: 检查 user.json 配置
        run: python3 .github/workflows/inject_config.py

      - name: 运行看广告脚本
        env:
          TZ: 'Asia/Shanghai'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_ROUNDS: ${{ github.event.inputs.rounds }}
        run: python3 .github/workflows/run_ads.py
